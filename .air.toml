root = "."
tmp_dir = "tmp"

[build]
  entrypoint = ["./tmp/main"]
  cmd = "go build -o ./tmp/main ./cmd/task-tracker"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "docker"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  log = "build-errors.log"
  include_file = ["api/openapi/swagger.json"]

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
