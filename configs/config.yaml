server:
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  shutdown_timeout: 15s

mysql:
  host: mysql
  port: 3306
  name: team_tasks
  user: app
  max_request_time: 5s
  pool:
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m
  retry:
    max_attempts: 10
    delay: 2s

auth:
  jwt_ttl: 5m
  login_limit:
    interval: 6s
    burst: 5
    max_entries: 10000
  register_limit:
    interval: 1m
    burst: 3
    max_entries: 10000

redis:
  addr: redis:6379
  db: 0
  pool_size: 10
  max_request_time: 5s
  cache_ttl: 5m
  load_timeout: 5s
  retry:
    max_attempts: 10
    delay: 2s

docs:
  enabled: false

rate_limit:
  interval: 100ms
  burst: 30
  max_entries: 10000
